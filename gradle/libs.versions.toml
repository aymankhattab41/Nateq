# Version Catalog الموحّد — مصدر واحد لإصدارات التبعيات والإضافات.
# تُستبدل أي سلسلة إصدار مكررة في ملفات build.gradle.kts بهذا المرجع
# عبر libs.xxx — لا إصداران صراعان، والترقية تتم في مكان واحد.

[versions]
# --- إضافات البناء -------------------------------------------------------
# أندرويد 17 (API 37) يتطلب AGP 9.1+؛ وAGP 9 يدمج Kotlin (Built-in Kotlin).
agp = "9.2.0"
# KSP 2.3.3+ = الحد الأدنى المتوافق مع AGP 9/Built-in Kotlin.
ksp = "2.3.3"
# Hilt 2.59+ يوثّق التوافق مع AGP 9 (الحد الأدنى في جدول التوافقية).
hilt = "2.59"

# --- AndroidX --------------------------------------------------------------
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.13.0"
preferenceKtx = "1.2.1"
# مقصود إبقاؤه على alpha06 (موثّق في تعليق :app): آخر نسخة فيها API مشفّر
# يعمل عبر minSdk 24 دون ComponentFactory/تطبيق DenyList فك جذر. لا تُرقَّى عشوائياً.
securityCrypto = "1.1.0-alpha06"
hiltNavigationFragment = "1.2.0"
lifecycleViewmodelKtx = "2.8.7"
fragmentKtx = "1.8.6"
androidxTestCore = "1.6.1"
androidxTestExtJunit = "1.2.1"

# --- مكتبات خارجية ---------------------------------------------------------
gson = "2.12.1"
coroutines = "1.10.1"

# --- اختبارات ---------------------------------------------------------------
junit = "4.13.2"
robolectric = "4.14.1"

[libraries]
# AndroidX أساسية
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preferenceKtx" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-fragment = { group = "androidx.hilt", name = "hilt-navigation-fragment", version.ref = "hiltNavigationFragment" }

# كوروتينز
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# Gson (واجهة NateqJson المركزية والـ ParameterizedType)
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# اختبارات
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }