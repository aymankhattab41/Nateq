name = "lord-tts-support-relay"
main = "src/index.js"
compatibility_date = "2026-09-06"

# الأسرار تُضبط عبر `wrangler secret put` ولا تُوضع هنا ولا في git:
#   - TELEGRAM_BOT_TOKEN: رمز البوت (من @BotFather)
#   - SUPPORT_CHAT_ID: معرّفك الرقمي في تليجرام (من @userinfobot)
#   - WEBHOOK_SECRET: سرّ الويب هوك (يطابق secret_token في setWebhook)
#
# طريقة الضبط (مرة واحدة):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put SUPPORT_CHAT_ID
#   npx wrangler secret put WEBHOOK_SECRET
#
# قيود معدل الرسائل (كل مرسل): عداد عبر Cloudflare KV يُعيد [RATE_LIMITS] —
# نافذة 60 ثانية وحدّ 20 رسالة (ثوابت في src/index.js). الخدمة تنتشر وتعمل
# بالكامل بدون هذا الربط (الكود يتسامح غياب env.RATE_LIMITS ويسمح دائمًا)؛
# ولتفعيل الحد الآن:
#   1) npx wrangler kv namespace create RATE_LIMITS
#   2) ضَع الـ id الناتج في السطر الموضح وأزل علامات التعليق أدناه
#   3) npx wrangler deploy
# ملاحظة: معرّف وهمي (نص نائب) هنا يُفشل النشر على wrangler — لا تضع قيمة
# غير مُنشأة فعلاً، لذا بقي الربط معلّقاً صحيحاً لا placeholder يكسره.
# [[kv_namespaces]]
# binding = "RATE_LIMITS"
# id = "ضع_معرف_الـ_namespace_المُنشأ_فعلاً_هنا"
