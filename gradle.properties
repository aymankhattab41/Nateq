org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
kotlin.code.style=official

# AGP 9 + KSP: يُستخدم KSP لمعالجة الشيفرة وقت التجميع بدل KAPT،
# لتسريع البناء وتقليل الاعتماد على DSL الخاص بـ Kotlin.
# خيار android.sourceSets يمنع تضارب مسارات المصادر مع Hilt
# (الذي يُنشئ مسارات مصادر إضافية).
android.disallowKotlinSourceSets=false

# Disable data binding to avoid "too many parameters" error in generated binding classes
android.databinding.enabled=false
android.enableDataBinding=false
